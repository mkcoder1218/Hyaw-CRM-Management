name: Deploy CRM to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hyaw-crm-production
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SEED_SUPER_ADMIN_PASSWORD: ${{ secrets.SEED_SUPER_ADMIN_PASSWORD }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_SELLER_PASSWORD: ${{ secrets.SEED_SELLER_PASSWORD }}
          SEED_CALLER_PASSWORD: ${{ secrets.SEED_CALLER_PASSWORD }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: DATABASE_URL,JWT_SECRET,SEED_SUPER_ADMIN_PASSWORD,SEED_ADMIN_PASSWORD,SEED_SELLER_PASSWORD,SEED_CALLER_PASSWORD,NEXT_PUBLIC_API_URL
          script: |
            set -e

            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/opt/hyaw-crm"
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$(dirname "$APP_DIR")"
              git clone https://github.com/mkcoder1218/Hyaw-CRM-Management.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            : "${DATABASE_URL:?DATABASE_URL GitHub secret is required}"
            : "${JWT_SECRET:?JWT_SECRET GitHub secret is required}"
            : "${SEED_SUPER_ADMIN_PASSWORD:?SEED_SUPER_ADMIN_PASSWORD GitHub secret is required}"
            : "${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD GitHub secret is required}"
            : "${SEED_SELLER_PASSWORD:?SEED_SELLER_PASSWORD GitHub secret is required}"
            : "${SEED_CALLER_PASSWORD:?SEED_CALLER_PASSWORD GitHub secret is required}"

            if [ -z "$NEXT_PUBLIC_API_URL" ]; then
              NEXT_PUBLIC_API_URL="https://apiCRMhyaw.tech/api"
            fi

            umask 077
            cat > .env.production <<EOF
            DATABASE_URL=$DATABASE_URL
            API_PORT=8002
            NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
            JWT_SECRET=$JWT_SECRET
            SEED_SUPER_ADMIN_PASSWORD=$SEED_SUPER_ADMIN_PASSWORD
            SEED_ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD
            SEED_SELLER_PASSWORD=$SEED_SELLER_PASSWORD
            SEED_CALLER_PASSWORD=$SEED_CALLER_PASSWORD
            EOF
            chmod 600 .env.production

            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --remove-orphans || {
              echo "Deployment failed. CRM container status:"
              docker compose --env-file .env.production -f docker-compose.prod.yml ps -a || true
              echo "CRM API logs:"
              docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color --tail=200 crm-api || true
              exit 1
            }
            docker image prune -f

            check_url() {
              name="$1"
              url="$2"
              attempts=18
              delay=5

              i=1
              while [ "$i" -le "$attempts" ]; do
                if curl --silent --show-error --fail --max-time 10 "$url" >/dev/null; then
                  echo "$name is ready: $url"
                  return 0
                fi
                echo "$name not ready yet ($i/$attempts); retrying in 5s..."
                sleep "$delay"
                i=$((i + 1))
              done

              echo "$name failed readiness check: $url"
              docker compose --env-file .env.production -f docker-compose.prod.yml ps -a || true
              docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color --tail=200 || true
              return 1
            }

            check_url "CRM API" "http://127.0.0.1:8002/api/health"
            check_url "CRM Web" "http://127.0.0.1:8000/"
            check_url "CRM Admin" "http://127.0.0.1:8001/"
