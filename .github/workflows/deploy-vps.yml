name: Deploy CRM to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hyaw-crm-production
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm build

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="/opt/hyaw-crm"; fi
            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            test -f .env.production
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f
            curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:8002/api/health
            curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:8000/
            curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:8001/
