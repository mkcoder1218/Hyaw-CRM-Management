name: Deploy CRM to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hyaw-crm-production
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SEED_SUPER_ADMIN_PASSWORD: ${{ secrets.SEED_SUPER_ADMIN_PASSWORD }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_SELLER_PASSWORD: ${{ secrets.SEED_SELLER_PASSWORD }}
          SEED_CALLER_PASSWORD: ${{ secrets.SEED_CALLER_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: DATABASE_URL,JWT_SECRET,SEED_SUPER_ADMIN_PASSWORD,SEED_ADMIN_PASSWORD,SEED_SELLER_PASSWORD,SEED_CALLER_PASSWORD
          script: |
            set -eu

            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/opt/hyaw-crm"
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$(dirname "$APP_DIR")"
              git clone https://github.com/mkcoder1218/Hyaw-CRM-Management.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            : "${DATABASE_URL:?DATABASE_URL GitHub secret is required}"
            : "${JWT_SECRET:?JWT_SECRET GitHub secret is required}"
            : "${SEED_SUPER_ADMIN_PASSWORD:?SEED_SUPER_ADMIN_PASSWORD GitHub secret is required}"
            : "${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD GitHub secret is required}"
            : "${SEED_SELLER_PASSWORD:?SEED_SELLER_PASSWORD GitHub secret is required}"
            : "${SEED_CALLER_PASSWORD:?SEED_CALLER_PASSWORD GitHub secret is required}"

            NEXT_PUBLIC_API_URL="/api"
            INTERNAL_API_URL="http://crm-api:8002/api"

            umask 077
            cat > .env.production <<EOF
            DATABASE_URL=$DATABASE_URL
            API_PORT=8002
            NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
            INTERNAL_API_URL=$INTERNAL_API_URL
            JWT_SECRET=$JWT_SECRET
            SEED_SUPER_ADMIN_PASSWORD=$SEED_SUPER_ADMIN_PASSWORD
            SEED_ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD
            SEED_SELLER_PASSWORD=$SEED_SELLER_PASSWORD
            SEED_CALLER_PASSWORD=$SEED_CALLER_PASSWORD
            EOF
            chmod 600 .env.production

            check_url() {
              name="$1"
              url="$2"
              attempts="${3:-18}"
              delay="${4:-5}"
              i=1
              while [ "$i" -le "$attempts" ]; do
                if curl --silent --show-error --fail --max-time 10 "$url" >/dev/null; then
                  echo "$name is ready: $url"
                  return 0
                fi
                echo "$name not ready yet ($i/$attempts); retrying in ${delay}s..."
                sleep "$delay"
                i=$((i + 1))
              done
              echo "$name failed readiness check: $url"
              return 1
            }

            # Find the actual reverse proxy first. This VPS uses deploy-nginx-1.
            NGINX_CONTAINER=""
            if docker ps --format '{{.Names}}' | grep -qx 'deploy-nginx-1'; then
              NGINX_CONTAINER="deploy-nginx-1"
            else
              for candidate in $(docker ps --format '{{.Names}}'); do
                if docker exec "$candidate" sh -c 'command -v nginx >/dev/null 2>&1' >/dev/null 2>&1; then
                  NGINX_CONTAINER="$candidate"
                  break
                fi
              done
            fi

            if [ -z "$NGINX_CONTAINER" ]; then
              echo "No running Nginx reverse-proxy container was found."
              docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}' || true
              exit 1
            fi

            echo "Using reverse proxy container: $NGINX_CONTAINER"

            # nginx -T tells us the exact file that owns the CRM server block.
            NGINX_CONFIG="$(
              docker exec "$NGINX_CONTAINER" nginx -T 2>&1 |
              awk '
                /^# configuration file / {
                  f=$4
                  sub(/:$/, "", f)
                }
                {
                  line=tolower($0)
                  if (line ~ /server_name[[:space:]].*crm\.hyaw\.tech/) {
                    print f
                    exit
                  }
                }
              '
            )"

            if [ -z "$NGINX_CONFIG" ]; then
              echo "Could not find the CRM server block in the active Nginx configuration."
              echo "CRM-related Nginx lines:"
              docker exec "$NGINX_CONTAINER" nginx -T 2>&1 | grep -i -C 4 'hyaw.tech' || true
              exit 1
            fi

            echo "Active CRM Nginx config: $NGINX_CONFIG"

            # Map the container config back to its host bind mount when possible.
            NGINX_EDIT_PATH=""
            while IFS='|' read -r mount_source mount_destination; do
              [ -n "$mount_source" ] || continue
              [ -n "$mount_destination" ] || continue
              case "$NGINX_CONFIG" in
                "$mount_destination")
                  NGINX_EDIT_PATH="$mount_source"
                  break
                  ;;
                "$mount_destination"/*)
                  suffix="${NGINX_CONFIG#"$mount_destination"}"
                  NGINX_EDIT_PATH="$mount_source$suffix"
                  break
                  ;;
              esac
            done <<EOF
            $(docker inspect -f '{{range .Mounts}}{{printf "%s|%s\n" .Source .Destination}}{{end}}' "$NGINX_CONTAINER")
            EOF

            if [ -n "$NGINX_EDIT_PATH" ]; then
              echo "Editing host-mounted Nginx config: $NGINX_EDIT_PATH"
              NGINX_EDIT_MODE="host-mount"
            else
              echo "Nginx config is not bind-mounted; editing container file directly."
              NGINX_EDIT_MODE="container"
            fi

            # Use the gateway of the Nginx container's Docker network.
            # Target slot ports are bound to this host-side bridge address, so
            # Dockerized Nginx can reach them without exposing them publicly.
            NGINX_GATEWAY="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{printf "%s " .Gateway}}{{end}}' "$NGINX_CONTAINER" | awk '{print $1}')"
            if [ -z "$NGINX_GATEWAY" ]; then
              echo "Could not determine the reverse proxy Docker-network gateway."
              exit 1
            fi
            echo "Reverse proxy host gateway: $NGINX_GATEWAY"

            ACTIVE_SLOT_FILE="$APP_DIR/.active-slot"
            ACTIVE_SLOT=""
            if [ -f "$ACTIVE_SLOT_FILE" ]; then
              ACTIVE_SLOT="$(cat "$ACTIVE_SLOT_FILE" 2>/dev/null || true)"
            fi

            if [ "$ACTIVE_SLOT" = "green" ]; then
              TARGET_SLOT="blue"
              TARGET_WEB_PORT=8000
              TARGET_ADMIN_PORT=8001
              TARGET_API_PORT=8002
              OLD_PROJECT="hyaw-crm-green"
            else
              TARGET_SLOT="green"
              TARGET_WEB_PORT=8100
              TARGET_ADMIN_PORT=8101
              TARGET_API_PORT=8102
              if [ "$ACTIVE_SLOT" = "blue" ]; then
                OLD_PROJECT="hyaw-crm-blue"
              else
                OLD_PROJECT="hyaw-crm"
              fi
            fi

            TARGET_PROJECT="hyaw-crm-$TARGET_SLOT"
            echo "Active slot: ${ACTIVE_SLOT:-legacy}"
            echo "Deploying inactive slot: $TARGET_SLOT"
            echo "Target ports: web=$TARGET_WEB_PORT admin=$TARGET_ADMIN_PORT api=$TARGET_API_PORT"

            cleanup_target() {
              echo "Cleaning failed $TARGET_SLOT deployment..."
              CRM_BIND_IP="$NGINX_GATEWAY" \
              CRM_WEB_HOST_PORT="$TARGET_WEB_PORT" \
              CRM_ADMIN_HOST_PORT="$TARGET_ADMIN_PORT" \
              CRM_API_HOST_PORT="$TARGET_API_PORT" \
              docker compose --env-file .env.production -p "$TARGET_PROJECT" -f docker-compose.prod.yml down --remove-orphans || true
            }

            CRM_BIND_IP="$NGINX_GATEWAY" \
            CRM_WEB_HOST_PORT="$TARGET_WEB_PORT" \
            CRM_ADMIN_HOST_PORT="$TARGET_ADMIN_PORT" \
            CRM_API_HOST_PORT="$TARGET_API_PORT" \
            docker compose --env-file .env.production -p "$TARGET_PROJECT" -f docker-compose.prod.yml up -d --build --remove-orphans || {
              echo "New stack failed to start."
              CRM_BIND_IP="$NGINX_GATEWAY" \
              CRM_WEB_HOST_PORT="$TARGET_WEB_PORT" \
              CRM_ADMIN_HOST_PORT="$TARGET_ADMIN_PORT" \
              CRM_API_HOST_PORT="$TARGET_API_PORT" \
              docker compose --env-file .env.production -p "$TARGET_PROJECT" -f docker-compose.prod.yml ps -a || true
              CRM_BIND_IP="$NGINX_GATEWAY" \
              CRM_WEB_HOST_PORT="$TARGET_WEB_PORT" \
              CRM_ADMIN_HOST_PORT="$TARGET_ADMIN_PORT" \
              CRM_API_HOST_PORT="$TARGET_API_PORT" \
              docker compose --env-file .env.production -p "$TARGET_PROJECT" -f docker-compose.prod.yml logs --no-color --tail=200 || true
              cleanup_target
              exit 1
            }

            if ! check_url "CRM API ($TARGET_SLOT)" "http://$NGINX_GATEWAY:$TARGET_API_PORT/api/health"; then
              cleanup_target
              exit 1
            fi
            if ! check_url "CRM Web ($TARGET_SLOT)" "http://$NGINX_GATEWAY:$TARGET_WEB_PORT/"; then
              cleanup_target
              exit 1
            fi
            if ! check_url "CRM Admin ($TARGET_SLOT)" "http://$NGINX_GATEWAY:$TARGET_ADMIN_PORT/"; then
              cleanup_target
              exit 1
            fi

            echo "Running direct API authentication smoke test..."
            AUTH_RESPONSE_FILE="/tmp/hyaw-crm-auth-response.$"
            AUTH_STATUS="$(
              curl --silent --show-error \
                --output "$AUTH_RESPONSE_FILE" \
                --write-out '%{http_code}' \
                --max-time 20 \
                -H 'Content-Type: application/json' \
                --data "{\"email\":\"superadmin@hyaw.local\",\"password\":\"$SEED_SUPER_ADMIN_PASSWORD\"}" \
                "http://$NGINX_GATEWAY:$TARGET_API_PORT/api/auth/login" || true
            )"
            if [ "$AUTH_STATUS" != "200" ]; then
              echo "Direct API authentication smoke test failed with HTTP $AUTH_STATUS."
              echo "Response:"
              cat "$AUTH_RESPONSE_FILE" || true
              echo
              echo "CRM API logs:"
              CRM_BIND_IP="$NGINX_GATEWAY" \
              CRM_WEB_HOST_PORT="$TARGET_WEB_PORT" \
              CRM_ADMIN_HOST_PORT="$TARGET_ADMIN_PORT" \
              CRM_API_HOST_PORT="$TARGET_API_PORT" \
              docker compose --env-file .env.production -p "$TARGET_PROJECT" -f docker-compose.prod.yml logs --no-color --tail=200 crm-api || true
              rm -f "$AUTH_RESPONSE_FILE"
              cleanup_target
              exit 1
            fi
            rm -f "$AUTH_RESPONSE_FILE"
            echo "Direct API authentication smoke test passed."

            # Confirm the reverse proxy container can reach the new slot before switching.
            if ! docker exec "$NGINX_CONTAINER" sh -c "wget -qO- http://$NGINX_GATEWAY:$TARGET_API_PORT/api/health >/dev/null"; then
              echo "Nginx container cannot reach the new API slot."
              cleanup_target
              exit 1
            fi
            if ! docker exec "$NGINX_CONTAINER" sh -c "wget -qO- http://$NGINX_GATEWAY:$TARGET_WEB_PORT/ >/dev/null"; then
              echo "Nginx container cannot reach the new web slot."
              cleanup_target
              exit 1
            fi
            if ! docker exec "$NGINX_CONTAINER" sh -c "wget -qO- http://$NGINX_GATEWAY:$TARGET_ADMIN_PORT/ >/dev/null"; then
              echo "Nginx container cannot reach the new admin slot."
              cleanup_target
              exit 1
            fi

            NGINX_BACKUP="/tmp/hyaw-crm-nginx.$$.bak"
            if [ "$NGINX_EDIT_MODE" = "host-mount" ]; then
              cp "$NGINX_EDIT_PATH" "$NGINX_BACKUP"
            else
              docker cp "$NGINX_CONTAINER:$NGINX_CONFIG" "$NGINX_BACKUP"
            fi

            restore_nginx_file() {
              if [ "$NGINX_EDIT_MODE" = "host-mount" ]; then
                cp "$NGINX_BACKUP" "$NGINX_EDIT_PATH" || true
              else
                docker cp "$NGINX_BACKUP" "$NGINX_CONTAINER:$NGINX_CONFIG" || true
              fi
            }

            edit_nginx_file() {
              if [ "$NGINX_EDIT_MODE" = "host-mount" ]; then
                sed -E -i \
                  -e "s#apiCRMhyaw\\.tech#apiCRM.hyaw.tech#g" \
                  -e "s#apicrmhyaw\\.tech#apicrm.hyaw.tech#g" \
                  -e "s#(proxy_pass[[:space:]]+http://)[^;[:space:]]+:(8000|8100);#\\1$NGINX_GATEWAY:$TARGET_WEB_PORT;#g" \
                  -e "s#(proxy_pass[[:space:]]+http://)[^;[:space:]]+:(8001|8101);#\\1$NGINX_GATEWAY:$TARGET_ADMIN_PORT;#g" \
                  -e "s#(proxy_pass[[:space:]]+http://)[^;[:space:]]+:(8002|8102);#\\1$NGINX_GATEWAY:$TARGET_API_PORT;#g" \
                  "$NGINX_EDIT_PATH"
              else
                docker exec "$NGINX_CONTAINER" sh -c "sed -E -i \
                  -e 's#apiCRMhyaw\\.tech#apiCRM.hyaw.tech#g' \
                  -e 's#apicrmhyaw\\.tech#apicrm.hyaw.tech#g' \
                  -e 's#(proxy_pass[[:space:]]+http://)[^;[:space:]]+:(8000|8100);#\\1$NGINX_GATEWAY:$TARGET_WEB_PORT;#g' \
                  -e 's#(proxy_pass[[:space:]]+http://)[^;[:space:]]+:(8001|8101);#\\1$NGINX_GATEWAY:$TARGET_ADMIN_PORT;#g' \
                  -e 's#(proxy_pass[[:space:]]+http://)[^;[:space:]]+:(8002|8102);#\\1$NGINX_GATEWAY:$TARGET_API_PORT;#g' \
                  '$NGINX_CONFIG'"
              fi
            }

            rollback_nginx() {
              echo "Rolling Nginx back to the previous upstreams..."
              restore_nginx_file
              docker exec "$NGINX_CONTAINER" nginx -t || true
              docker exec "$NGINX_CONTAINER" nginx -s reload || true
            }

            edit_nginx_file

            echo "CRM proxy targets after switch:"
            if [ "$NGINX_EDIT_MODE" = "host-mount" ]; then
              grep -nE 'proxy_pass.*:(8000|8001|8002|8100|8101|8102)' "$NGINX_EDIT_PATH" || true
            else
              docker exec "$NGINX_CONTAINER" grep -nE 'proxy_pass.*:(8000|8001|8002|8100|8101|8102)' "$NGINX_CONFIG" || true
            fi

            if ! docker exec "$NGINX_CONTAINER" nginx -t; then
              rollback_nginx
              cleanup_target
              exit 1
            fi

            if ! docker exec "$NGINX_CONTAINER" nginx -s reload; then
              rollback_nginx
              cleanup_target
              exit 1
            fi

            if ! check_url "Public CRM Web" "https://crm.hyaw.tech/" 12 5; then
              rollback_nginx
              cleanup_target
              exit 1
            fi
            if ! check_url "Public CRM Admin" "https://admincrm.hyaw.tech/" 12 5; then
              rollback_nginx
              cleanup_target
              exit 1
            fi
            if ! check_url "Public CRM API through Web" "https://crm.hyaw.tech/api/health" 12 5; then
              rollback_nginx
              cleanup_target
              exit 1
            fi
            if ! check_url "Public CRM API through Admin" "https://admincrm.hyaw.tech/api/health" 12 5; then
              rollback_nginx
              cleanup_target
              exit 1
            fi

            printf '%s\n' "$TARGET_SLOT" > "$ACTIVE_SLOT_FILE"
            rm -f "$NGINX_BACKUP"

            echo "Traffic switched successfully to $TARGET_SLOT. Retiring $OLD_PROJECT..."
            docker compose --env-file .env.production -p "$OLD_PROJECT" -f docker-compose.prod.yml down --remove-orphans || true
            docker image prune -f
            echo "Zero-downtime deployment complete. Active slot: $TARGET_SLOT"
